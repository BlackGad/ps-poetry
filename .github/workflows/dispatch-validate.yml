name: VALIDATE PR

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  checks: write

jobs:
  validate:
    name: Validate Python Project (py${{ matrix.python_version }})
    strategy:
      fail-fast: false
      matrix:
        python_version: ['3.12', '3.13', '3.14']
    uses: ./.github/workflows/reusable-python.yml
    with:
      working_directory: .
      python_version: ${{ matrix.python_version }}
